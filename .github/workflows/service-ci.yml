name: Service CI

on:
  pull_request:
    branches: [feature/new-service, 'mvp/**']
  push:
    branches: [feature/new-service]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm service:typecheck
      - name: Unit tests
        run: pnpm service:test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - name: Start Supabase (migrations and seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
      - name: Database tests
        run: pnpm test:db
      - name: Export local keys
        run: |
          supabase status -o env --override-name api.url=VITE_SUPABASE_URL --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY \
            | grep -E '^VITE_SUPABASE_(URL|ANON_KEY)=' | tr -d '"' >> "$GITHUB_ENV"

      - name: Build service for e2e
        run: pnpm service:build
        env:
          VITE_E2E: '1'
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
