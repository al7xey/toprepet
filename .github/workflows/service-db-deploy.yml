name: Service DB deploy

# The service shares the Supabase project of the blog, so nothing is applied automatically:
# - a push to feature/new-service that touches supabase/** only prints what `db push` would apply (dry run);
# - a manual run with "dry_run" switched off applies the migrations and deploys the send-email function.
on:
  push:
    branches: [feature/new-service]
    paths: ['supabase/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the migrations that would be applied
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: service-db-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets are not set, skipping" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.40.7
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Dry run (migrations that would be applied)
        if: steps.secrets.outputs.ready == 'true' && env.APPLY != 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push migrations
        if: steps.secrets.outputs.ready == 'true' && env.APPLY == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy functions
        if: steps.secrets.outputs.ready == 'true' && env.APPLY == 'true'
        run: supabase functions deploy send-email --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
