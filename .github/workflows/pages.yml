name: Deploy to GitHub Pages

on:
  push:
    branches: [main, codex/liquid-glass]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout public design preview
        uses: actions/checkout@v4
        with:
          ref: codex/liquid-glass
          path: preview
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            production/pnpm-lock.yaml
            preview/pnpm-lock.yaml
      - name: Build production site at domain root
        working-directory: production
        env:
          VITE_API_MODE: demo
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Build design branch under /preview/
        working-directory: preview
        env:
          VITE_API_MODE: demo
          VITE_BASE_PATH: /preview/
        run: pnpm install --frozen-lockfile && pnpm run build:e2e && pnpm exec tsc --noEmit
      - name: Combine the unchanged production root and isolated branch preview
        run: |
          mkdir -p site/preview
          cp -a production/dist/. site/
          cp -a preview/dist/. site/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
