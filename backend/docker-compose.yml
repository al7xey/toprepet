# Локальный запуск «как в проде»: Postgres + Django. Не проверялся в среде разработки без Docker-демона, смотрите docs/backend.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: toprepet
      POSTGRES_USER: toprepet
      POSTGRES_PASSWORD: toprepet
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toprepet"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://toprepet:toprepet@db:5432/toprepet
      DEBUG: "1"
      ALLOWED_ORIGINS: http://localhost:5173
      SITE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
  jobs:
    build: .
    depends_on:
      - api
    command: ["sh", "-c", "while true; do python manage.py run_jobs; sleep 60; done"]
    environment:
      DATABASE_URL: postgres://toprepet:toprepet@db:5432/toprepet
      DEBUG: "1"
volumes:
  dbdata:
  media:
